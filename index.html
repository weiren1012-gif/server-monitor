<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务器监控（永久页）</title>
<style>
  :root {
    --bg: #0b0f1a; --card: rgba(22,30,54,.72); --card2: rgba(30,40,70,.55); --border: rgba(148,163,205,.16);
    --text: #eef2ff; --muted: #93a0bd; --green: #34d399; --yellow: #fbbf24;
    --orange: #fb923c; --red: #f87171; --blue: #60a5fa; --cyan: #22d3ee; --purple: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(96,165,250,.16), transparent 55%),
      radial-gradient(900px 600px at 110% 10%, rgba(192,132,252,.12), transparent 50%),
      radial-gradient(800px 500px at 50% 120%, rgba(34,211,238,.08), transparent 55%),
      linear-gradient(180deg, #101a33, #070b14 40%);
    background-attachment: fixed;
    color: var(--text); font-family: -apple-system, "SF Pro Display", "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif; padding: 20px 20px 40px; min-height: 100vh;
  }
  .header { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
  .header h1 {
    font-size: 22px; font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 10px;
    background: linear-gradient(120deg, #dbeafe, #60a5fa 45%, #c084fc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot.ok { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .dot.warn { background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
  .dot.crit { background: var(--red); box-shadow: 0 0 12px var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .badge { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 1px; backdrop-filter: blur(6px); }
  .badge.ok { background: rgba(52,211,153,.13); color: var(--green); border: 1px solid rgba(52,211,153,.35); }
  .badge.warn { background: rgba(251,191,36,.13); color: var(--yellow); border: 1px solid rgba(251,191,36,.35); }
  .badge.crit { background: rgba(248,113,113,.15); color: var(--red); border: 1px solid rgba(248,113,113,.4); animation: pulse 1s infinite; }
  .meta { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .meta b { color: var(--text); }
  #alertBanner { display: none; padding: 12px 18px; border-radius: 14px; margin-bottom: 16px; font-weight: 700; font-size: 14px; backdrop-filter: blur(8px); }
  #alertBanner.warn { display: block; background: rgba(251,191,36,.1); color: var(--yellow); border: 1px solid rgba(251,191,36,.4); }
  #alertBanner.crit { display: block; background: rgba(248,113,113,.12); color: var(--red); border: 1px solid rgba(248,113,113,.5); animation: pulse 1s infinite; }
  .grid { display: grid; gap: 16px; }
  .gpu-grid { grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px;
    backdrop-filter: blur(14px); box-shadow: 0 8px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: rgba(148,163,205,.3); box-shadow: 0 12px 36px rgba(0,0,0,.45); }
  .card h3 {
    font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 14px; letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .card h3::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: linear-gradient(180deg, var(--blue), var(--purple)); box-shadow: 0 0 8px rgba(129,140,248,.6); }
  .gpu-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .gpu-name { font-size: 15px; font-weight: 700; }
  .gpu-sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; word-break: break-all; letter-spacing: .3px; }
  .occ-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
  .occ-badge.idle { background: rgba(52,211,153,.12); color: var(--green); border: 1px solid rgba(52,211,153,.3); }
  .occ-badge.busy { background: rgba(34,211,238,.12); color: var(--cyan); border: 1px solid rgba(34,211,238,.3); }
  .gpu-gauges { display: flex; gap: 10px; margin-bottom: 14px; }
  .gauge-box { flex: 1; text-align: center; background: rgba(255,255,255,.03); border: 1px solid rgba(148,163,205,.1); border-radius: 14px; padding: 10px 4px 8px; }
  .gauge-wrap { position: relative; width: 84px; height: 84px; margin: 0 auto; }
  .gauge-wrap svg { display: block; }
  .gauge-val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .gauge-lbl { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; margin-top: 6px; }
  .metric { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .metric .label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .metric .label b { color: var(--text); font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: rgba(148,163,205,.12); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 999px; transition: width .8s cubic-bezier(.22,.61,.36,1); background: linear-gradient(90deg, var(--blue), var(--purple)); box-shadow: 0 0 10px rgba(96,165,250,.45); }
  .statline { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .statline b { color: var(--text); font-variant-numeric: tabular-nums; }
  .sys-grid { grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); }
  .proc-item { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; }
  .proc-item .pn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .proc-item .pid { color: var(--muted); font-family: "SF Mono", ui-monospace, monospace; font-size: 11px; }
  .proc-item .pm { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
  .ptag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  .ptag.compute { background: rgba(96,165,250,.16); color: #93c5fd; }
  .ptag.display { background: rgba(148,163,205,.14); color: var(--muted); }
  .proc-empty { font-size: 12px; color: var(--green); }
  .proc-list { margin-top: 12px; border-top: 1px solid rgba(148,163,205,.12); padding-top: 8px; }
  .proc-list .pt { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; margin-bottom: 4px; font-weight: 600; }
  .fallback-note { font-size: 11px; color: var(--muted); background: var(--card2); border: 1px dashed rgba(148,163,205,.25); border-radius: 10px; padding: 8px 10px; margin-top: 10px; }
  .chart-box { height: 160px; position: relative; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .alert-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; background: var(--card2); border: 1px solid rgba(148,163,205,.1); border-radius: 12px; font-size: 12px; margin-bottom: 6px; backdrop-filter: blur(6px); }
  .alert-item .lv { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
  .lv.warn { background: var(--yellow); color: var(--yellow); } .lv.crit { background: var(--red); color: var(--red); } .lv.ok { background: var(--green); color: var(--green); }
  .alert-item .t { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .alert-item .val { color: var(--muted); font-size: 11px; }
  .foot { text-align: center; color: var(--muted); font-size: 11px; margin: 18px 0 6px; line-height: 1.7; }
  .stale { color: var(--orange); font-weight: 600; }
  .occ-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted); margin-bottom: 10px; align-items: center; }
  .occ-legend i { display: inline-block; width: 16px; height: 11px; border-radius: 4px; margin-right: 5px; vertical-align: middle; }
  .occ-legend .c0 { background: #0e1730; border: 1px solid rgba(148,163,205,.2); }
  .occ-legend .c1 { background: #34d399; }
  .occ-legend .c2 { background: #fbbf24; }
  .occ-legend .c3 { background: #fb923c; }
  .occ-legend .c4 { background: #f87171; }
  .occ-legend .c5 { background: #22d3ee; }
  .ses-item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 13px; background: var(--card2); border: 1px solid rgba(148,163,205,.1); border-radius: 12px; font-size: 12px; margin-bottom: 8px; border-left: 3px solid var(--blue); backdrop-filter: blur(6px); }
  .ses-item .sg { font-weight: 800; color: var(--cyan); min-width: 46px; letter-spacing: .5px; }
  .ses-item .st { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 11px; line-height: 1.6; }
  .ses-item .sp { flex: 1; line-height: 1.7; }
  .ses-item .sip { color: var(--muted); font-family: "SF Mono", ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="header">
    <h1><span id="statusDot" class="dot ok"></span> 服务器监控</h1>
    <span id="statusBadge" class="badge ok">正常</span>
    <div class="meta">
      <div><b id="hostname">-</b></div>
      <div>数据更新于 <b id="updateTime">-</b></div>
    </div>
  </div>
  <div id="alertBanner"></div>
  <div class="grid gpu-grid" id="gpuGrid"></div>
  <div style="height:14px"></div>
  <div class="grid sys-grid">
    <div class="card"><h3>CPU</h3>
      <div class="metric"><div class="label"><span>总使用率</span><b id="cpuPct">-</b></div>
      <div class="bar"><span id="cpuBar" style="width:0%"></span></div></div>
      <div class="statline"><div>负载 (1/5/15)</div><div><b id="cpuLoad">-</b></div>
      <div>核心数</div><div><b id="cpuCores">-</b></div></div>
    </div>
    <div class="card"><h3>内存</h3>
      <div class="metric"><div class="label"><span>物理内存</span><b id="memPct">-</b></div>
      <div class="bar"><span id="memBar" style="width:0%"></span></div></div>
      <div class="statline"><div>已用 / 总量</div><div><b id="memUsed">-</b></div>
      <div>可用</div><div><b id="memAvail">-</b></div></div>
    </div>
    <div class="card"><h3>磁盘</h3><div id="disks"></div></div>
    <div class="card"><h3>历史趋势（最近约 1 小时）</h3>
      <div class="chart-box"><canvas id="chartCpu"></canvas></div>
      <div class="legend" id="cpuLegend"></div>
      <div class="chart-box" style="margin-top:10px"><canvas id="chartGpu"></canvas></div>
      <div class="legend" id="gpuLegend"></div>
    </div>
  </div>
  <div style="height:14px"></div>
  <div class="card">
    <h3>预警记录</h3>
    <div id="alertLog" style="color:var(--muted);font-size:13px">暂无预警</div>
  </div>
  <div style="height:14px"></div>
  <div class="card">
    <h3>历史占用记录（最近 24 小时）</h3>
    <div class="occ-legend">
      <span>占用率色标：</span>
      <span><i class="c0"></i>空闲</span>
      <span><i class="c1"></i>&lt;30%</span>
      <span><i class="c2"></i>30-60%</span>
      <span><i class="c3"></i>60-90%</span>
      <span><i class="c4"></i>&gt;90%</span>
      <span><i class="c5"></i>仅进程占用</span>
    </div>
    <div class="chart-box" style="height:130px"><canvas id="chartOcc"></canvas></div>
    <div id="occSessions"></div>
  </div>
  <div class="foot">
    本页为<strong>永久地址</strong>，数据由服务器每约 2 分钟自动推送更新（GitHub Pages 缓存可能再延迟几分钟）。<br>
    实时刷新版请用服务器监控系统首页。 | 页面最后生成：2026-08-16
  </div>

<script>
const COLORS = ["#3b82f6","#06b6d4","#22c55e","#eab308","#f97316","#ef4444","#a855f7","#14b8a6","#ec4899","#84cc16"];
function colorByVal(v, warn=80, crit=90){
  if (v >= crit) return "var(--red)";
  if (v >= warn) return "var(--orange)";
  if (v >= warn-20) return "var(--yellow)";
  return "var(--green)";
}
function fmtBytes(n){
  if (n == null) return "-";
  const u = ["B","KB","MB","GB","TB"]; let i = 0;
  while (n >= 1024 && i < u.length-1){ n/=1024; i++; }
  return n.toFixed(i?1:0) + " " + u[i];
}
function esc(s){ return String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function drawChart(canvas, series, labels, yMax, colors){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr); ctx.clearRect(0,0,w,h);
  if (!series.length) return;
  const n = series[0].length;
  const pad = 4;
  const maxX = Math.max(n-1, 1);
  const px = i => pad + i/maxX*(w-2*pad);
  const py = v => h - pad - (v/yMax)*(h-2*pad);
  ctx.strokeStyle = "#1a2236"; ctx.fillStyle = "#8b97ad"; ctx.font = "10px sans-serif";
  for (const g of [0, 0.5, 1]){
    ctx.beginPath(); ctx.moveTo(pad, py(g*yMax)); ctx.lineTo(w-pad, py(g*yMax));
    ctx.stroke();
  }
  ctx.textAlign = "left"; ctx.fillText(yMax, 2, 10);
  series.forEach((data, si) => {
    ctx.strokeStyle = colors[si % colors.length];
    ctx.lineWidth = 1.5; ctx.beginPath();
    data.forEach((v, i) => {
      if (v == null) return;
      const x = px(i), y = py(Math.min(v, yMax));
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  });
}

function gaugeSvg(v, max, c1, c2, size){
  size = size || 84;
  const r = size/2 - 7;
  const c = 2*Math.PI*r;
  const pct = Math.max(0, Math.min(100, (v||0)/max*100));
  const off = c * (1 - pct/100);
  const gid = "g" + Math.random().toString(36).slice(2,8);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(148,163,205,.13)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${gid})" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .8s ease"/>
    <defs><linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
    </linearGradient></defs>
  </svg>`;
}

function tempGrad(t){
  if (t >= 85) return ["#f87171", "#ef4444"];
  if (t >= 75) return ["#fb923c", "#f87171"];
  if (t >= 60) return ["#fbbf24", "#fb923c"];
  return ["#34d399", "#22d3ee"];
}

function renderGpus(gpus){
  const grid = document.getElementById("gpuGrid");
  grid.innerHTML = "";
  gpus.forEach(g => {
    const procs = g.procs || [];
    const busy = procs.length > 0;
    const badge = busy ? `<span class="occ-badge busy">${procs.length} 个进程</span>` : '<span class="occ-badge idle">空闲</span>';
    let procHtml = '<div class="proc-list"><div class="pt">进程占用</div>';
    if (!busy) procHtml += '<div class="proc-empty">空闲 · 无进程占用</div>';
    else procs.forEach(p => {
      const tag = p.type === "compute" ? '<span class="ptag compute">计算</span>' : p.type === "display" ? '<span class="ptag display">显示</span>' : '';
      const mem = (p.mem && p.mem > 0) ? `<span class="pm">${fmtBytes(p.mem)}</span>` : '';
      procHtml += `<div class="proc-item"><span class="pn">${esc(p.name || ("PID "+p.pid))}</span><span class="pid">${p.pid}</span>${tag}${mem}${(p.ips&&p.ips.length)?`<span class="pm">IP:${p.ips.join(",")}</span>`:""}</div>`;
    });
    procHtml += '</div>';
    const head = `<div class="gpu-head">
        <div class="gpu-name">${esc(g.name || ("GPU "+g.index))}</div>${badge}
      </div>
      <div class="gpu-sub">${esc(g.bus || (g.uuid ? g.uuid.slice(0,8) : ""))} · 插槽 #${g.index}</div>`;
    if (g.fallback) {
      grid.insertAdjacentHTML("beforeend", `<div class="card">${head}${procHtml}
        <div class="fallback-note">驱动未加载，利用率/温度/显存暂不可读</div></div>`);
      return;
    }
    const memPct = g.mem_total ? (g.mem_used/g.mem_total*100) : 0;
    const t = g.temp ?? 0, u = g.util ?? 0;
    const [tc1, tc2] = tempGrad(t);
    const gauges = `<div class="gpu-gauges">
      <div class="gauge-box">
        <div class="gauge-wrap">${gaugeSvg(t, 110, tc1, tc2)}
          <div class="gauge-val" style="color:${tc1}">${g.temp ?? "-"}°</div></div>
        <div class="gauge-lbl">温度</div>
      </div>
      <div class="gauge-box">
        <div class="gauge-wrap">${gaugeSvg(u, 100, "#60a5fa", "#a78bfa")}
          <div class="gauge-val" style="color:${colorByVal(u,80,90)}">${g.util ?? "-"}%</div></div>
        <div class="gauge-lbl">利用率</div>
      </div>
      <div class="gauge-box">
        <div class="gauge-wrap">${gaugeSvg(memPct, 100, "#22d3ee", "#60a5fa")}
          <div class="gauge-val" style="color:#22d3ee">${memPct.toFixed(0)}%</div></div>
        <div class="gauge-lbl">显存</div>
      </div>
    </div>`;
    grid.insertAdjacentHTML("beforeend", `<div class="card">${head}${gauges}
      <div class="metric"><div class="label"><span>显存使用</span><b>${fmtBytes(g.mem_used)} / ${fmtBytes(g.mem_total)}</b></div>
        <div class="bar"><span style="width:${memPct}%"></span></div></div>
      <div class="statline"><div>功耗</div><div><b>${g.power ?? "-"} W</b></div>
        <div>功率上限</div><div><b>${g.power_limit ?? "-"} W</b></div>
        <div>风扇</div><div><b>${g.fan ?? "-"}%</b></div>
        <div>性能状态</div><div><b>P${g.pstate ?? "-"}</b></div></div>
      ${procHtml}</div>`);
  });
}

function render(m){
  document.getElementById("hostname").textContent = m.hostname || "-";
  document.getElementById("updateTime").textContent = new Date(m.ts*1000).toLocaleString();
  const stale = (Date.now()/1000 - m.ts) > 600;
  if (stale) document.getElementById("updateTime").innerHTML = '<span class="stale">' + new Date(m.ts*1000).toLocaleString() + '（数据可能过时）</span>';

  const alerts = m.alerts || [];
  const level = alerts.length ? (alerts.some(a=>a.level==="crit") ? "crit" : "warn") : "ok";
  document.getElementById("statusDot").className = "dot " + level;
  const badge = document.getElementById("statusBadge");
  badge.className = "badge " + level;
  badge.textContent = level === "ok" ? "正常" : (level === "crit" ? "危险" : "警告");
  const banner = document.getElementById("alertBanner");
  if (level !== "ok"){ banner.className = level; banner.textContent = "⚠ 预警：" + alerts.map(a=>`${a.label} ${a.extra||a.value||""}`).join("；"); }
  else { banner.className = ""; banner.textContent = ""; }

  document.getElementById("cpuPct").textContent = (m.cpu.percent||0).toFixed(0) + "%";
  document.getElementById("cpuBar").style.width = (m.cpu.percent||0) + "%";
  document.getElementById("cpuBar").style.background = (m.cpu.percent||0) >= 90 ? colorByVal(m.cpu.percent, 90, 97) : "";
  document.getElementById("cpuLoad").textContent = m.cpu.load["1"].toFixed(2)+" / "+m.cpu.load["5"].toFixed(2)+" / "+m.cpu.load["15"].toFixed(2);
  document.getElementById("cpuCores").textContent = m.cpu.cores;
  document.getElementById("memPct").textContent = (m.mem.percent||0).toFixed(0) + "%";
  document.getElementById("memBar").style.width = (m.mem.percent||0) + "%";
  document.getElementById("memBar").style.background = (m.mem.percent||0) >= 90 ? colorByVal(m.mem.percent, 90, 97) : "";
  document.getElementById("memUsed").textContent = fmtBytes(m.mem.used) + " / " + fmtBytes(m.mem.total);
  document.getElementById("memAvail").textContent = fmtBytes(m.mem.available);

  const diskBox = document.getElementById("disks");
  diskBox.innerHTML = "";
  (m.disks||[]).forEach(d => {
    diskBox.insertAdjacentHTML("beforeend", `<div class="metric">
      <div class="label"><span>${esc(d.mount)}</span><b>${fmtBytes(d.used)} / ${fmtBytes(d.total)}</b></div>
      <div class="bar"><span style="width:${d.percent}%;background:${colorByVal(d.percent,85,95)}"></span></div></div>`);
  });
  if (!(m.disks||[]).length) diskBox.innerHTML = '<div style="color:var(--muted);font-size:12px">无磁盘数据</div>';

  renderGpus(m.gpus || []);

  const hist = m.history || [];
  const cpu = [], mem = [], gpuU = [], gpuT = [];
  const gpus = m.gpus || [];
  for (let gi = 0; gi < gpus.length; gi++){ gpuU.push([]); gpuT.push([]); }
  hist.forEach(h => {
    cpu.push(h.cpu); mem.push(h.mem);
    (h.gpu||[]).forEach((g, gi) => {
      if (gpuU[gi]) gpuU[gi].push(g.util);
      if (gpuT[gi]) gpuT[gi].push(g.temp);
    });
  });
  const times = hist.map(h => new Date(h.ts*1000).toLocaleTimeString());
  drawChart(document.getElementById("chartCpu"), [cpu, mem], times, 100, ["#3b82f6","#22c55e"]);
  document.getElementById("cpuLegend").innerHTML = '<span style="color:#3b82f6">CPU %</span><span style="color:#22c55e">内存 %</span>';
  const gSeries = [], gColors = [];
  gpus.forEach((g, gi) => { gSeries.push(gpuU[gi]||[]); gColors.push(COLORS[gi%COLORS.length]); });
  const g2 = [];
  gpus.forEach((g, gi) => { g2.push(gpuT[gi]||[]); });
  g2.forEach((s, si) => { gSeries.push(s); gColors.push(COLORS[si%COLORS.length]); });
  drawChart(document.getElementById("chartGpu"), gSeries, times, 110, gColors);
  const lg = document.getElementById("gpuLegend");
  lg.innerHTML = gpus.map((g,gi)=>`<span style="color:${COLORS[gi%COLORS.length]}">GPU${gi} 利用率</span>`).join("") +
    gpus.map((g,gi)=>`<span style="color:${COLORS[gi%COLORS.length]}">GPU${gi} 温度</span>`).join("");

  const logBox = document.getElementById("alertLog");
  if (!(m.alert_log||[]).length){ logBox.innerHTML = '<div style="color:var(--muted);font-size:13px">暂无预警</div>'; }
  else {
    logBox.innerHTML = "";
    m.alert_log.slice(0,30).forEach(a => {
      const lv = a.event === "resolved" ? "ok" : a.level;
      logBox.insertAdjacentHTML("beforeend", `<div class="alert-item"><span class="lv ${lv}"></span>
        <div><b>${esc(a.label)}</b> ${a.event==="resolved"?"已恢复":(a.level==="crit"?"危险":"警告")}
        <div class="val">${esc(typeof a.value==="string"?a.value:(a.extra||""))}</div></div>
        <span class="t">${new Date(a.time*1000).toLocaleTimeString()}</span></div>`);
    });
  }

  renderOcc(m.gpu_history);
}

function occColor(util, occ){
  if (!occ) return "#0d1526";
  if (util == null) return "#06b6d4";
  if (util >= 90) return "#ef4444";
  if (util >= 60) return "#f97316";
  if (util >= 30) return "#eab308";
  return "#22c55e";
}

function renderOcc(d){
  const canvas = document.getElementById("chartOcc");
  if (!canvas || !d || !d.series) return;
  const series = d.series || [];
  const gpuCount = Math.max(1, ...(series.map(s => Math.max(0, ...Object.keys(s.gpus||{}).map(Number))))) + 1;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr); ctx.clearRect(0,0,w,h);
  if (!series.length){
    ctx.fillStyle = "#8b97ad"; ctx.font = "12px sans-serif";
    ctx.fillText("暂无历史数据（记录从本系统启用后开始）", 10, h/2);
    document.getElementById("occSessions").innerHTML = '<div style="color:var(--muted);font-size:13px">暂无记录</div>';
    return;
  }
  const n = series.length;
  const labelW = 42;
  const cw = (w - labelW) / n;
  const rh = (h - 16) / gpuCount;
  series.forEach((s, i) => {
    const x = labelW + i*cw;
    for (let gi = 0; gi < gpuCount; gi++){
      const gd = (s.gpus||{})[gi];
      if (!gd || !gd.occ) continue;
      ctx.fillStyle = occColor(gd.util, true);
      ctx.fillRect(x, gi*rh, Math.max(1, cw), rh);
    }
  });
  ctx.fillStyle = "#8b97ad"; ctx.font = "10px sans-serif";
  for (let gi = 0; gi < gpuCount; gi++) ctx.fillText("GPU"+gi, 2, gi*rh + rh*0.65);
  const now = d.generated*1000;
  const span = d.hours*3600*1000;
  ctx.textAlign = "center";
  for (let t = 0; t < d.hours; t += 3){
    const ts = now - span + t*3600*1000;
    const x = labelW + (t/d.hours)*(w-labelW);
    ctx.fillStyle = "#8b97ad";
    ctx.fillText(new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), x, h-4);
    ctx.strokeStyle = "#1a2236";
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h-16); ctx.stroke();
  }
  ctx.textAlign = "left";

  const box = document.getElementById("occSessions");
  if (!d.sessions || !d.sessions.length){
    box.innerHTML = '<div style="color:var(--muted);font-size:13px">近 24 小时无占用记录</div>';
    return;
  }
  box.innerHTML = "";
  const fmt = ts => new Date(ts*1000).toLocaleString([], {month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  d.sessions.slice().sort((a,b)=>b.start-a.start).forEach(s => {
    const procs = (s.procs||[]).map(p => {
      const ip = (p.ips||[]).length ? ` <span class="sip">IP:${p.ips.join(",")}</span>` : "";
      return `<span>${esc(p.name||("PID "+p.pid))} (${esc((p.cmd||"").slice(0,40)||("PID "+p.pid))})${ip}</span>`;
    }).join("<br>");
    box.insertAdjacentHTML("beforeend", `<div class="ses-item">
      <span class="sg">GPU${s.gpu}</span>
      <span class="st">${fmt(s.start)} → ${fmt(s.end)}<br>${fmtDuration(s.end-s.start)}</span>
      <div class="sp"><b>${s.util_avg != null ? "平均利用率 "+s.util_avg+"%" : "被进程占用"}</b>${s.temp_max != null ? " · 最高温度 "+s.temp_max+"°C" : ""}<br>${procs}</div>
    </div>`);
  });
}

function fmtDuration(sec){
  sec = Math.round(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60);
  return (h ? h+"小时" : "") + (m ? m+"分" : (h? "": (sec+"秒")));
}

async function load(){
  try {
    const r = await fetch("metrics.json?t=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch(e){
    const grid = document.getElementById("gpuGrid");
    grid.innerHTML = '<div class="card" style="grid-column:1/-1;text-align:center;color:var(--muted)">等待服务器数据推送…（首次发布后需等待数分钟）</div>';
  }
}
load();
setInterval(load, 20000);
</script>
